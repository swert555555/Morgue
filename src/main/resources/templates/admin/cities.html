<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление городами</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <style>
        .collapse {
            display: none;
        }
    </style>
</head>
<style>
    body {
        margin: 0;
        padding: 20px;
        display: grid;
        justify-content: between;
        align-items: center;
        overflow-y: auto;
    }
</style>
<body>
<h1>Управление городами</h1>
<a href="/">На главную</a><br>

<table>
    <thead>
    <tr>
        <th>Название</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="city : ${cities}">
        <td th:text="${city.name}"></td>
        <td>
            <button type="button" class="btn btn-sm" data-toggle="collapse" th:data-target="'#editForm' + ${city.id}">
                Редактировать
            </button>
            <form th:action="@{|/admin/cities/${city.id}/delete|}" method="post"
                  style="display:inline;">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                    Дропнуть
                </button>
            </form>
        </td>
        <div class="collapse ms-2 me-auto" th:id="'editForm' + ${city.id}">
            <br>
            <form th:action="@{|/admin/cities/${city.id}/edit|}" method="post"
                  style="display:inline;">
                <label for="name_edit">Название</label>
                <input type="text" th:value="${city.name}" name="name" id="name_edit"
                       required>
                <button type="submit" class="btn">Сохранить</button>
            </form>
        </div>
    </tr>
    </tbody>
</table>
<br>
<h4>Новый город</h4>
<form action="/admin/cities/add" method="post" th:object="${city}">
    <label for="name">Название</label>
    <input type="text" id="name" name="name" th:field="*{name}" required><br>
    <button type="submit" class="btn">Добавить</button>
</form>

</body>
</html>
